[project]
name = "rsync-commander"
version = "0.1.0"
description = "Dual-panel file commander that syncs big files over ssh with block-level verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "zstandard>=0.22; python_version < '3.14'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]   # pip/uv-tool installs: rsync-commander[gui]

[project.scripts]
rsync-commander = "rcommander.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]
# In a checkout, `uv run` includes the GUI by default. On a headless box:
#   uv run --no-group gui rsync-commander batch profile.toml
gui = ["PySide6>=6.7"]

[tool.uv]
default-groups = ["dev", "gui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcommander"]

[tool.pytest.ini_options]
testpaths = ["tests"]
