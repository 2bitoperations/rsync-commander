[project]
name = "rsync-commander"
version = "0.1.0"
description = "Dual-panel file commander that syncs big files over ssh with block-level verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "zstandard>=0.22; python_version < '3.14'"]

[project.scripts]
rsync-commander = "rcommander.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcommander"]

[tool.pytest.ini_options]
testpaths = ["tests"]
